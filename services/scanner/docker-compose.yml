# Production-style scanner worker (run from repository root:
# docker compose -f services/scanner/docker-compose.yml up --build)
services:
  scanner:
    build:
      context: ../..
      dockerfile: services/scanner/Dockerfile
    ports:
      - "8080:8080"
    environment:
      SCANNER_SERVICE_TOKEN: ${SCANNER_SERVICE_TOKEN:?set SCANNER_SERVICE_TOKEN}
      SCANNER_MAX_CONCURRENT: "1"
      PORT: "8080"
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
